name: Bug
description: Quelque chose ne fonctionne pas comme documenté
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Pour une **faille de sécurité**, ne créez pas d'issue publique : voir [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: Comportement observé et attendu
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: Étapes pour reproduire
      description: Mode (proxy / forward), ports utilisés, présence de Traefik, URL d'accès (HTTPS ?).
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Version ou commit
  - type: input
    id: browser
    attributes:
      label: Navigateur et authenticator (ex. Chrome 141 + clé YubiKey, Safari + iCloud Keychain)
  - type: textarea
    id: logs
    attributes:
      label: Logs du conteneur (sans secret)
      render: text
