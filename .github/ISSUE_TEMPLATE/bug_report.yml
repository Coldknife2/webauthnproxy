name: Bug
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a **security vulnerability**, do not open a public issue: see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: Observed and expected behavior
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Mode (proxy / forward), ports used, whether Traefik is involved, access URL (HTTPS?).
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: input
    id: browser
    attributes:
      label: Browser and authenticator (e.g. Chrome 141 + YubiKey, Safari + iCloud Keychain)
  - type: textarea
    id: logs
    attributes:
      label: Container logs (no secrets)
      render: text
