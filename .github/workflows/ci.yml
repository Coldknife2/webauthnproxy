name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...
      - name: changelog script
        run: scripts/test-changelog-section.sh

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make build
      - name: e2e dependencies
        working-directory: test/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: e2e proxy + enrollment + static tool
        working-directory: test/e2e
        run: npm run test:proxy
      - name: e2e rate limiting
        working-directory: test/e2e
        run: npm run test:ratelimit
      - name: e2e forwardAuth (Traefik)
        working-directory: test/e2e
        env:
          RUNTIME: docker
        run: npm run test:forward
      - name: e2e forwardAuth across domains (Traefik)
        working-directory: test/e2e
        env:
          RUNTIME: docker
        run: npm run test:crossdomain
      - name: build the image the examples run
        run: docker build --build-arg VERSION=ci -t localhost/webauthnproxy:examples .
      - name: the two complete examples (examples/)
        working-directory: test/e2e
        env:
          RUNTIME: docker
        run: node ../examples/run.cjs

  image:
    # Builds the image on every run; pushes it to the registries only on pushes to main and on v* tags,
    # after the tests and e2e jobs succeeded.
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
      # Optional second registry: only used when the DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets exist.
      DH_IMAGE: ${{ secrets.DOCKERHUB_USERNAME != '' && format('docker.io/{0}/webauthnproxy', secrets.DOCKERHUB_USERNAME) || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: env.PUSH == 'true' && env.DH_IMAGE != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ env.DH_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - name: Build (amd64) and smoke-test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: webauthnproxy:ci
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm webauthnproxy:ci --version
      - name: Build and push (amd64 + arm64)
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha

  release:
    # On v* tags only: a GitHub Release whose notes are the CHANGELOG section of that version, with Linux binaries and checksums.
    # The release fails (nothing is published) if CHANGELOG.md has no notes for the tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, e2e, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Release notes from CHANGELOG.md
        run: scripts/changelog-section.sh "$GITHUB_REF_NAME" > release-notes.md
      - name: Build binaries
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME#v}" -o "dist/webauthnproxy-linux-$arch" .
          done
          (cd dist && sha256sum webauthnproxy-linux-* > SHA256SUMS)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $prerelease --title "$GITHUB_REF_NAME" --notes-file release-notes.md dist/*
