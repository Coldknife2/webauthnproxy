name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatage
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make build
      - name: Dépendances e2e
        working-directory: test/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: e2e proxy + enrôlement + outil statique
        working-directory: test/e2e
        run: npm run test:proxy
      - name: e2e forwardAuth (Traefik)
        working-directory: test/e2e
        env:
          RUNTIME: docker
        run: npm run test:forward

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t webauthnproxy .
