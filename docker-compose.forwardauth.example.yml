# forwardAuth mode: a single webauthnproxy protects several sites behind Traefik.
# Traefik -> (verify) webauthnproxy ; Traefik -> website directly.
services:
  traefik:
    image: docker.io/library/traefik:v3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=vous@example.com
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports: ["443:443"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt

  webauthnproxy:
    image: ghcr.io/coldknife2/webauthnproxy:latest   # pin a version in production, e.g. :1.2.3
    # build: .                                        # or build from source
    environment:
      MODE: forward
      LOGIN_URL: https://auth.example.com/_wap/login
      # Shortlist of the sites this login may protect, on ANY domain (host, host:port or *.domain):
      ALLOWED_HOSTS: app.example.com,anysite.com,*.example.org
      # COOKIE_DOMAIN: example.com          # optional shortcut: shared cookie for the subdomains of one parent domain
      RP_ID: example.com                    # domain of the LOGIN host (passkeys live there, not on the protected sites)
      RP_ORIGINS: https://auth.example.com  # origin of the login page (+ the enrollment page's if enabled)
      # ENROLL_ENABLED: "true"   # automatic enrollment (8081); TOOL_ENABLED=true for the static tool (8082)
    volumes:
      - ./data:/data
    labels:
      - traefik.enable=true
      # Login host (public)
      # /_wap/verify is for Traefik only (it reaches it directly, not through this router): keep it off the public router
      - traefik.http.routers.auth.rule=Host(`auth.example.com`) && !PathPrefix(`/_wap/verify`)
      - traefik.http.routers.auth.entrypoints=websecure
      - traefik.http.routers.auth.tls.certresolver=le
      - traefik.http.services.auth.loadbalancer.server.port=8080
      # Reusable middleware, attach it to any router
      - traefik.http.middlewares.passkey.forwardauth.address=http://webauthnproxy:8080/_wap/verify
      - traefik.http.middlewares.passkey.forwardauth.authResponseHeaders=X-Authenticated-User

  mysite:
    image: docker.io/library/nginx:alpine
    labels:
      - traefik.enable=true
      - traefik.http.routers.mysite.rule=Host(`app.example.com`)
      - traefik.http.routers.mysite.entrypoints=websecure
      - traefik.http.routers.mysite.tls.certresolver=le
      - traefik.http.routers.mysite.middlewares=passkey   # <- the protection
