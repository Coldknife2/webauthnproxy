<!doctype html>
<html lang="en" data-i18n-title="enrollTitle"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Passkey enrollment</title>
<style>
 body{font-family:system-ui,sans-serif;max-width:40rem;margin:2rem auto;padding:0 1rem;color:#111}
 input,button{font-size:1rem;padding:.5rem .8rem;border-radius:6px;border:1px solid #bbb}
 button{background:#2563eb;color:#fff;border:0;cursor:pointer}
 button.del{background:#b91c1c;padding:.2rem .6rem;font-size:.85rem}
 li{margin:.4rem 0}
 #msg{min-height:1.4em;margin-top:.8rem} .err{color:#b91c1c} .ok{color:#15803d}
 .warn{background:#fef3c7;padding:.6rem 1rem;border-radius:8px}
 form{display:flex;flex-wrap:wrap;gap:.5rem} [hidden]{display:none!important}
</style></head>
<body>
 <h1 data-i18n="enrollTitle">Passkey enrollment</h1>
 <p id="who"></p>
 <p id="boot" class="warn" data-i18n="bootHint" hidden>No passkey exists yet. Enter the bootstrap token printed in the service logs.</p>
 <form id="f">
   <input id="token" data-i18n-ph="token" placeholder="Bootstrap token" autocomplete="off" hidden>
   <input id="name" data-i18n-ph="username" placeholder="User name" required maxlength="64" autofocus>
   <input id="label" data-i18n-ph="labelPh" placeholder="Label (e.g. phone)" maxlength="40">
   <button data-i18n="addPasskey">Add a passkey</button>
 </form>
 <div id="msg"></div>
 <h2 data-i18n="registered">Registered passkeys</h2>
 <ul id="list"></ul>
 <form id="out" method="post" action="/_wap/logout" hidden><button data-i18n="signOut">Sign out</button></form>
<script src="/_wap/app.js"></script>
<script src="/_wap/i18n.js"></script>
<script src="/_wap/enroll.js"></script>
</body></html>
